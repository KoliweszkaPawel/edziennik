<form [formGroup]="newGradeForm" (ngSubmit)="onSubmit(formDir)" #formDir="ngForm">
  <h3>Nowa ocena</h3>
  <mat-form-field>
    <mat-label>Uczeń</mat-label>
    <mat-select formControlName="studentId">
      @for (student of students(); track student.uid) {
        <mat-option [value]="student.uid">{{student.email}}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Przedmiot</mat-label>
    <input matInput formControlName="subject">
  </mat-form-field>

  <mat-form-field>
    <mat-label>Ocena</mat-label>
    <input matInput type="number" formControlName="value">
  </mat-form-field>

  <mat-form-field>
    <mat-label>Waga</mat-label>
    <input matInput type="number" formControlName="weight">
  </mat-form-field>

  <mat-form-field>
    <mat-label>Opis</mat-label>
    <input matInput formControlName="description">
  </mat-form-field>

  <button matButton type="submit" [disabled]="newGradeForm.invalid">Wystaw ocenę</button>
</form>
