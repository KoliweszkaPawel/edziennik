<table mat-table [dataSource]="grades()">

  <ng-container matColumnDef="subject">
    <th mat-header-cell *matHeaderCellDef> Przedmiot </th>
    <td mat-cell *matCellDef="let grade"> {{grade.subject}} </td>
  </ng-container>

  <ng-container matColumnDef="value">
    <th mat-header-cell *matHeaderCellDef> Ocena </th>
    <td mat-cell *matCellDef="let grade"> {{grade.value}} </td>
  </ng-container>

  <ng-container matColumnDef="weight">
    <th mat-header-cell *matHeaderCellDef> Waga </th>
    <td mat-cell *matCellDef="let grade"> {{grade.weight}} </td>
  </ng-container>

  <ng-container matColumnDef="createdAt">
    <th mat-header-cell *matHeaderCellDef> Data wpisania </th>
    <td mat-cell *matCellDef="let grade"> {{grade.createdAt | date: 'short'}} </td>
  </ng-container>

  <ng-container matColumnDef="teacher">
    <th mat-header-cell *matHeaderCellDef> Nauczyciel </th>
    <td mat-cell *matCellDef="let grade"> {{grade.teacher}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
